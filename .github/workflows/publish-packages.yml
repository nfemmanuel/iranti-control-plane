name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to validate against package.json (e.g. v0.5.4)
        required: false
        type: string

jobs:
  verify_release:
    name: Verify Release Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package.json
            src/client/package.json
            src/server/package.json

      - name: Install root deps
        run: npm install

      - name: Install client deps
        run: npm install --prefix src/client

      - name: Install server deps
        run: npm install --prefix src/server

      - name: Verify release version alignment
        run: |
          TAG="${{ github.event.release.tag_name || inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            echo "No release tag provided — skipping version check"
            exit 0
          fi
          # Strip leading 'v' from tag
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(jq -r .version package.json)"
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: tag $TAG_VERSION != package.json $PKG_VERSION"
            exit 1
          fi

      - name: Type check client
        run: cd src/client && npx tsc --noEmit

      - name: Type check server
        run: cd src/server && npx tsc --noEmit

      - name: Run unit tests
        run: cd src/server && npx vitest run tests/unit

      - name: Build client
        run: npm run build:client

      - name: Build server bundle
        run: npm run package:bundle

      - name: Pack npm package
        run: |
          npm pack
          mkdir -p dist/packages
          mv iranti-control-plane-*.tgz dist/packages/

      - name: Smoke install from tarball
        run: |
          mkdir smoke-npm
          cd smoke-npm
          npm init -y
          npm install ../dist/packages/iranti-control-plane-*.tgz
          node -e "import('fs').then(fs => { const pkg = JSON.parse(fs.readFileSync('node_modules/iranti-control-plane/package.json','utf8')); console.log('Installed:', pkg.name, pkg.version); })"

      - name: Expose version
        id: version
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

  publish_npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify_release
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify npm publish token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not configured. Add an npm automation token as the NPM_TOKEN secret."
            exit 1
          fi

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install root deps
        run: npm install

      - name: Install client deps
        run: npm install --prefix src/client

      - name: Install server deps
        run: npm install --prefix src/server

      - name: Build client
        run: npm run build:client

      - name: Build server bundle
        run: npm run package:bundle

      - name: Publish
        run: |
          set +e
          publish_output="$(npm publish --access public 2>&1)"
          publish_status=$?
          set -e
          printf '%s\n' "$publish_output"
          if [ $publish_status -ne 0 ]; then
            if printf '%s' "$publish_output" | grep -q "npm error code EOTP"; then
              echo "::error::npm publish failed with EOTP. Replace NPM_TOKEN with an npm Automation token."
            fi
            exit $publish_status
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
