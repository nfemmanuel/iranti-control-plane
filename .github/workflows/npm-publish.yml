name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify npm publish token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not configured for this repository. Add an npm automation token as the NPM_TOKEN secret before rerunning this workflow."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install root deps
        run: npm install

      - name: Install client deps
        run: npm install --prefix src/client

      - name: Install server deps
        run: npm install --prefix src/server

      - name: Build client
        run: npm run build:client

      - name: Build server bundle
        run: npm run package:bundle

      - name: Publish
        run: |
          set +e
          publish_output="$(npm publish --access public 2>&1)"
          publish_status=$?
          set -e
          printf '%s\n' "$publish_output"
          if [ $publish_status -ne 0 ]; then
            if printf '%s' "$publish_output" | grep -q "npm error code EOTP"; then
              echo "::error::npm publish failed with EOTP. The NPM_TOKEN secret is present, but it is not an npm automation token. Replace NPM_TOKEN with an npm Automation token in GitHub Actions secrets and rerun this workflow."
            fi
            exit $publish_status
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
